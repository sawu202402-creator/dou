<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="小豌豆故事屋">
    <meta name="theme-color" content="#FFF6E8">
    <title>🐰 小豌豆魔法故事漫画屋</title>
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="app-shell" data-view="shelf" data-mode="storybook" data-pinyin="on">
        <header class="topbar" role="banner">
            <div class="topbar-brand-group">
                <button type="button" id="btn-back-shelf" class="nav-pill btn-back" hidden aria-label="返回魔法书架">
                    📚 <span>书架</span>
                </button>
                <div class="brand-lockup" id="brand-lockup">
                    <img src="apple-touch-icon.png" alt="小豌豆故事屋图标" class="brand-logo">
                    <div class="brand-text">
                        <span class="brand-name">小豌豆魔法故事漫画屋</span>
                        <span class="brand-book-name" id="header-book-title" hidden></span>
                    </div>
                </div>
                <div class="live-badge" id="live-status" title="每3秒自动接收魔法画师的新故事">
                    <span class="live-dot" aria-hidden="true"></span>
                    <span class="live-text">魔法连线中</span>
                </div>
            </div>

            <div class="topbar-controls">
                <div class="mode-capsule" id="mode-capsule" role="group" aria-label="切换阅读模式" hidden>
                    <button type="button" id="btn-mode-storybook" class="mode-btn is-active" data-mode="storybook" aria-pressed="true">
                        📖 绘本
                    </button>
                    <button type="button" id="btn-mode-comic" class="mode-btn" data-mode="comic" aria-pressed="false">
                        💬 漫画
                    </button>
                </div>

                <button type="button" id="btn-toggle-pinyin" class="ctrl-pill is-on" aria-pressed="true" title="开启或关闭二年级注音拼音">
                    <span class="pill-icon">拼</span>
                    <span class="pill-label">拼音</span>
                </button>

                <button type="button" id="btn-autoplay" class="ctrl-pill btn-autoplay" hidden aria-pressed="false" title="全书多角色连播">
                    <span id="autoplay-icon">▶️</span>
                    <span id="autoplay-label">连播</span>
                </button>

                <button type="button" id="btn-toggle-mute" class="ctrl-pill btn-mute" aria-pressed="false" aria-label="静音开关" title="声音开关">
                    🔊
                </button>
            </div>
        </header>

        <div id="hot-reload-banner" class="hot-reload-banner" role="status" aria-live="polite" hidden>
            <div class="banner-content">
                <span class="banner-sparkle" aria-hidden="true">🪄✨</span>
                <span class="banner-msg" id="hot-reload-msg"></span>
            </div>
            <div class="banner-actions">
                <button type="button" id="btn-banner-replay" class="banner-btn banner-btn-soft">🔊 听播报</button>
                <button type="button" id="btn-banner-go" class="banner-btn banner-btn-primary">马上查看 👉</button>
                <button type="button" id="btn-banner-close" class="banner-close" aria-label="关闭提醒">✕</button>
            </div>
        </div>

        <main id="main-stage" class="main-stage" tabindex="-1">
            <div class="loading-box">🪄 正在打开魔法书架……</div>
        </main>

        <footer id="reader-footer" class="reader-footer" hidden>
            <button type="button" id="btn-prev-page" class="page-nav-btn">⬅️ 上一页</button>
            <div class="page-indicator-wrap">
                <div id="page-dots" class="page-dots" role="tablist" aria-label="页码导航"></div>
                <span id="page-counter-text" class="page-counter-text">第 1 / 4 页</span>
            </div>
            <button type="button" id="btn-next-page" class="page-nav-btn">下一页 ➡️</button>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
